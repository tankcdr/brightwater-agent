name: ci

on:
  push:
  pull_request:

jobs:
  proofs:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brightwater
          POSTGRES_PASSWORD: brightwater
          POSTGRES_DB: brightwater
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brightwater"
          --health-interval 2s --health-retries 30
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/brightwater
          NEO4J_PLUGINS: '["apoc"]'
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p brightwater 'RETURN 1'"
          --health-interval 5s --health-retries 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv venv -p 3.14 && uv pip install -e ".[dev]"

      # Ch 0: deterministic fixture and the policy proofs.
      - run: uv run brightwater fixture generate
      - run: uv run brightwater db init && uv run brightwater db load && uv run brightwater policy sync

      # Ch 2: compile the semantic model and start Cube against it.
      - run: uv run brightwater semantic build
      - name: start cube
        run: |
          docker run -d --name cube --network host \
            -v "$PWD/semantic/cube:/cube/conf" \
            -e CUBEJS_DB_TYPE=postgres -e CUBEJS_DB_HOST=localhost -e CUBEJS_DB_NAME=brightwater \
            -e CUBEJS_DB_USER=brightwater -e CUBEJS_DB_PASS=brightwater \
            -e CUBEJS_DEV_MODE=true -e CUBEJS_API_SECRET=brightwater-dev-secret \
            cubejs/cube:v1.6.77
          for i in $(seq 1 60); do curl -sf localhost:4000/readyz && break; sleep 2; done

      # Ch 4: the skill must validate.
      - run: uv run aip-spec validate skills/brightwater-loan-assessment

      # Ch 8: the OPA policy's own tests.
      - run: docker run --rm -v "$PWD/policy/opa:/policy" openpolicyagent/opa:1.22.2 test /policy -v

      # Every chapter's proof that runs without a model API (scripted driver, stand-in decision model).
      - run: uv run pytest -v
