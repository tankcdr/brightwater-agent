# Services for the tutorial. Profiles add each chapter's services:
#
#   docker compose up -d                      # Ch 0-2: Postgres, Neo4j (memory), Cube
#   docker compose --profile aip up -d        # Ch 4+: Neo4j (AIP catalog) and the patched AIP server
#   docker compose --profile control up -d    # Ch 8:  Keycloak, OpenFGA, OPA, agentgateway
#
# Langfuse (Ch 3) is its own project:
#   docker compose -p langfuse -f docker/langfuse/docker-compose.yml --env-file docker/langfuse/langfuse.env up -d
#
# Models (Ch 6-7) run natively on Apple Silicon for Metal: Ollama for the driver and embeddings,
# mlx_lm.server for the decision model. On Linux with NVIDIA, compose.private.yaml runs vLLM and
# TEI instead, on a network with no route out.

name: brightwater

services:
  postgres:
    # postgres:16 plus pgvector and pgaudit.
    build: docker/postgres
    image: brightwater/postgres:16
    environment:
      POSTGRES_USER: brightwater
      POSTGRES_PASSWORD: brightwater
      POSTGRES_DB: brightwater
    # pgaudit logs every read with the relation it touched; %a puts the application name,
    # which carries the decision id (Ch 9), on every line.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - pgaudit.log=read
      - -c
      - pgaudit.log_relation=on
      - -c
      - pgaudit.log_parameter=on
      - -c
      - log_line_prefix=%m [%p] %a %u@%d 
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightwater"]
      interval: 2s
      retries: 30

  neo4j-memory:
    # The agent's memory graph (Ch 1). Community edition has one user database per server.
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/brightwater
      NEO4J_PLUGINS: '["apoc"]'
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j-memory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p brightwater 'RETURN 1' || exit 1"]
      interval: 5s
      retries: 30

  cube:
    # Cube Core (Apache-2.0), serving the model compiled from semantic/brightwater.ossie.yaml.
    image: cubejs/cube:v1.6.77
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_NAME: brightwater
      CUBEJS_DB_USER: brightwater
      CUBEJS_DB_PASS: brightwater
      CUBEJS_DEV_MODE: "true"
      CUBEJS_API_SECRET: brightwater-dev-secret
    ports: ["4000:4000"]
    volumes:
      - ./semantic/cube:/cube/conf

  # ---------------------------------------------------------------- Ch 4: AIP
  neo4j-aip:
    # The AIP catalog and run history: a second Neo4j, since Community has one user database.
    profiles: [aip]
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/brightwater
    ports: ["7475:7474", "7688:7687"]
    volumes:
      - neo4j-aip-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p brightwater 'RETURN 1' || exit 1"]
      interval: 5s
      retries: 30

  aip-server:
    # `aip server` with the Ch 6 resolver patch, on the Neo4j backend.
    profiles: [aip]
    build: {context: ., dockerfile: docker/brightwater/Dockerfile}
    image: brightwater/app:latest
    depends_on:
      neo4j-aip: {condition: service_healthy}
    command: [aip-server, --backend, neo4j, --uri, "bolt://neo4j-aip:7687", --user, neo4j,
              --password, brightwater, --host, 0.0.0.0, --port, "8000", --token, brightwater-aip-local]
    ports: ["8000:8000"]

  # ---------------------------------------------------------------- Ch 8: control plane
  keycloak:
    profiles: [control]
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8180"
      KC_HTTP_PORT: "8180"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports: ["8180:8180"]
    volumes:
      - ./docker/keycloak/brightwater-realm.json:/opt/keycloak/data/import/brightwater-realm.json:ro
    healthcheck:
      # Ready once the realm's signing keys are served, which is what the gateway fetches at start.
      # The image has no curl, so the probe speaks HTTP over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8180 && printf 'GET /realms/brightwater/protocol/openid-connect/certs HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  openfga:
    profiles: [control]
    image: openfga/openfga:v1.22.1
    command: [run]
    ports: ["8082:8080"]

  opa:
    profiles: [control]
    image: openpolicyagent/opa:1.22.2
    command: [run, --server, --addr, ":8181", /policy/brightwater.rego]
    ports: ["8181:8181"]
    volumes:
      - ./policy/opa:/policy:ro

  agentgateway:
    profiles: [control]
    image: cr.agentgateway.dev/agentgateway:v1.7.0
    command: [-f, /config/config.yaml]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["3100:3100", "3101:3101"]
    volumes:
      - ./gateway:/config:ro
    depends_on:
      keycloak: {condition: service_healthy}   # the gateway loads Keycloak's JWKS at start and exits if it can't
      opa: {condition: service_started}

volumes:
  pg-data:
  neo4j-memory-data:
  neo4j-aip-data:
