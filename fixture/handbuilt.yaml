# Six hand-built applicants, one per decision path.
#
# Every name and figure here is invented. The generator turns each entry into
# rows in the five systems of record. Cash flows are derived from
# `target_dscr`, so the debt service coverage ratio lands where the case needs
# it no matter how the monthly noise falls.
#
# target_dscr is computed on OPERATING cash flow only. `injections` are owner
# capital injections booked as non-operating inflow; the bank's original DSCR
# definition (Ch 0) counts them, which Ch 2 uses to show a governed change.
#
# `expect` is the contract the Ch 0 proof checks in CI.

as_of: 2026-10-31

bankers:
  - {banker_id: BKR-01, full_name: Delphine Okafor, email: dokafor@brightwater.example}
  - {banker_id: BKR-02, full_name: Marcus Velde, email: mvelde@brightwater.example}
  - {banker_id: BKR-03, full_name: Inez Albright, email: ialbright@brightwater.example}
  - {banker_id: BKR-04, full_name: Tobias Renn, email: trenn@brightwater.example}

