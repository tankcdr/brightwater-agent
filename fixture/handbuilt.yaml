    path: clean auto-approve
    business_id: BUS-H01
    legal_name: Larkspur Bindery LLC
    naics: "323120"
    state: NC
    established: 2014-09-01
    customer_since: 2017-04-03
    banker_id: BKR-01
    owners: [{person_id: PER-H01, pct: 100}]
    kyc: {status: current, last_reviewed: 2026-02-11, next_review_due: 2027-02-11}
    facilities:
      - {kind: term, original_amount: 150000, outstanding_balance: 92000, monthly_payment: 3000, opened: 2022-06-01}
    application: {requested_amount: 250000, term_months: 84, annual_rate: 0.085, submitted_on: 2026-10-14, purpose: equipment}
    target_dscr: 1.18
    # A one-time owner injection lifts the original DSCR from 1.18 to about 1.33.
    injections: [{month: 2026-03-01, amount: 12500}]
    notes:
      - {banker_id: BKR-01, written_on: 2026-09-30, body: "Owner plans to replace the two oldest folding lines. Seasonal peak runs August through December."}
    expect: {outcome: approve, fired: [], requires_person: false}

