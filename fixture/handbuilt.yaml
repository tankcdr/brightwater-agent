    application: {requested_amount: 600000, term_months: 120, annual_rate: 0.08, submitted_on: 2026-10-09, purpose: acquisition of a competitor's inventory}
    target_dscr: 1.44
    expect: {outcome: review, fired: [P4], requires_person: false}

