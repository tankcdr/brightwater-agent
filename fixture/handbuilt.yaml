    facilities:
      - {kind: term, original_amount: 400000, outstanding_balance: 250000, monthly_payment: 5600, opened: 2022-02-01}
    # Alone: 600k requested + 250k owed = 850k, under the 1.5M cap.
    # Counting the businesses its owners control: + 500k (Finch Marine) +
