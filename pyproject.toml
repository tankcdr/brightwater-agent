[project]
name = "brightwater"
version = "0.2.0"
description = "Tutorial: a governed small-business loan assessment agent on an open source intelligence stack"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"  # AIP 0.7.0 requires 3.14
# Every runtime dependency is MIT, Apache-2.0, BSD or PostgreSQL licensed.
# Versions are pinned per chapter tag; see docs/ for why each one is here.
dependencies = [
    "pyyaml==6.0.3",           # MIT
    "pg8000==1.31.6",          # BSD-3-Clause (pure Python; psycopg is LGPL)
    "httpx==0.28.1",           # BSD-3-Clause, Cube REST client
    "linkml==1.12.1",          # Apache-2.0, Ch 1
    "pyshacl==0.40.2",         # Apache-2.0, Ch 1
    "neo4j-agent-memory==0.8.0",  # Apache-2.0, Ch 1
    "jsonschema==4.26.0",      # MIT, validates the Ossie model, Ch 2
    # Ch 3 onward
    "langchain==1.4.9",        # MIT, agent loop (create_agent)
    "langgraph==1.2.20",       # MIT
    "langchain-anthropic==1.7.10",  # MIT, frontier baseline
    "langchain-openai==1.7.4", # MIT, any OpenAI-compatible server (Ch 7)
    "openai>=2.0,<4",          # Apache-2.0, OpenAI-compatible embeddings for neo4j-agent-memory (Ch 7)
    "opentelemetry-sdk==1.45.2",                 # Apache-2.0
    "opentelemetry-exporter-otlp-proto-http==1.45.2",  # Apache-2.0, to Langfuse
    # Ch 4 onward
    "agent-instruction-protocol[server]==0.7.0", # Apache-2.0
    "aip-spec==0.7.0",         # Apache-2.0
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
brightwater = "brightwater.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brightwater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "postgres: needs the Postgres service from compose.yaml",
    "neo4j: needs the Neo4j service from compose.yaml",
    "cube: needs the Cube service from compose.yaml",
]
