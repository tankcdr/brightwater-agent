# GENERATED by `brightwater semantic build` from brightwater.ossie.yaml. Do not edit;
# change the Ossie model and rebuild.
cubes:
- name: application_month
  description: 'One row per application per month in the DSCR window: the 12 full calendar months before the month
    of application, with cash flow summed across all of the business''s deposit accounts.'
  sql: SELECT a.application_id, cf.month, sum(cf.operating_inflow) AS operating_inflow, sum(cf.nonoperating_inflow)
    AS nonoperating_inflow, sum(cf.outflow) AS outflow, (SELECT coalesce(sum(f.monthly_payment), 0) FROM credit.facility
    f WHERE f.business_id = a.business_id AND f.opened < a.submitted_on) AS existing_monthly_payment, a.requested_amount,
    a.annual_rate, a.term_months FROM credit.application a JOIN ledger.deposit_account d ON d.business_id = a.business_id
    JOIN ledger.monthly_cash_flow cf ON cf.account_id = d.account_id WHERE cf.month >= date_trunc('month', a.submitted_on)
    - interval '12 months' AND cf.month < date_trunc('month', a.submitted_on) GROUP BY a.application_id, a.business_id,
    a.submitted_on, cf.month, a.requested_amount, a.annual_rate, a.term_months
  joins:
  - name: application
    relationship: many_to_one
    sql: '{CUBE}.application_id = {application}.application_id'
  dimensions:
  - name: application_id
    sql: '{CUBE}.application_id'
    type: string
    primary_key: true
    public: true
  - name: month
    sql: '{CUBE}.month'
    type: time
    primary_key: true
    public: true
  - name: net_cash_flow
    sql: '{CUBE}.operating_inflow + {CUBE}.nonoperating_inflow - {CUBE}.outflow'
    type: number
    description: Cash available for debt service in the month.
  - name: debt_service
    sql: '{CUBE}.existing_monthly_payment + {CUBE}.requested_amount * ({CUBE}.annual_rate / 12) / (1 - POWER(1 +
      {CUBE}.annual_rate / 12, -{CUBE}.term_months))'
    type: number
    description: 'Payments due in the month: existing facilities plus the level monthly payment on the requested
      loan.'
  measures:
  - name: cash_available
    type: number
    sql: SUM({net_cash_flow})
    description: Cash available for debt service over the window.
  - name: debt_service_total
    type: number
    sql: SUM({debt_service})
    description: Debt service due over the window.
  - name: dscr
    type: number
    sql: SUM({net_cash_flow}) / NULLIF(SUM({debt_service}), 0)
    description: Debt service coverage ratio over the 12-month window.
