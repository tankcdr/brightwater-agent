# GENERATED by `brightwater semantic build` from brightwater.ossie.yaml. Do not edit;
# change the Ossie model and rebuild.
cubes:
- name: application_profile
  description: One row per application with the applicant's compliance standing and tenure.
  sql: SELECT a.application_id, a.submitted_on, b.customer_since, k.status AS kyc_status, k.next_review_due AS kyc_next_review_due,
    (SELECT max(e.occurred_on) FROM compliance.adverse_event e WHERE e.business_id = a.business_id AND e.occurred_on
    <= a.submitted_on) AS last_adverse_event_on FROM credit.application a JOIN ledger.business b ON b.business_id
    = a.business_id LEFT JOIN compliance.kyc k ON k.business_id = a.business_id
  joins:
  - name: application
    relationship: many_to_one
    sql: '{CUBE}.application_id = {application}.application_id'
  dimensions:
  - name: application_id
    sql: '{CUBE}.application_id'
    type: string
    primary_key: true
    public: true
  - name: kyc_current
    sql: COALESCE({CUBE}.kyc_status = 'current' AND {CUBE}.kyc_next_review_due >= {CUBE}.submitted_on, FALSE)
    type: boolean
    description: KYC status is current and the next review is not overdue on the application date.
  - name: days_since_last_adverse_event
    sql: '{CUBE}.submitted_on - {CUBE}.last_adverse_event_on'
    type: number
    description: Days from the most recent adverse event on or before the application date. Null if none.
  - name: tenure_years
    sql: ROUND((({CUBE}.submitted_on - {CUBE}.customer_since) / 365.25)::numeric, 2)
    type: number
    description: Years the business has banked with Brightwater, as of the application date.
