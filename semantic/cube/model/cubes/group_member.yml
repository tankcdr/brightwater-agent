# GENERATED by `brightwater semantic build` from brightwater.ossie.yaml. Do not edit;
# change the Ossie model and rebuild.
cubes:
- name: group_member
  description: 'One row per application per business in its group: the applicant, plus every business in which any
    owner of the applicant holds more than 50%.'
  sql: SELECT a.application_id, m.business_id AS member_business_id, (m.business_id = a.business_id) AS is_applicant,
    a.requested_amount, (SELECT coalesce(sum(f.outstanding_balance), 0) FROM credit.facility f WHERE f.business_id
    = m.business_id) AS outstanding_balance FROM credit.application a CROSS JOIN LATERAL ( SELECT a.business_id
    UNION SELECT o2.business_id FROM registry.ownership o1 JOIN registry.ownership o2 ON o2.person_id = o1.person_id
    AND o2.pct > 50 WHERE o1.business_id = a.business_id ) AS m (business_id)
  joins:
  - name: application
    relationship: many_to_one
    sql: '{CUBE}.application_id = {application}.application_id'
  dimensions:
  - name: application_id
    sql: '{CUBE}.application_id'
    type: string
    primary_key: true
    public: true
  - name: member_business_id
    sql: '{CUBE}.member_business_id'
    type: string
    primary_key: true
    public: true
  - name: is_applicant
    sql: '{CUBE}.is_applicant'
    type: boolean
  - name: exposure
    sql: '{CUBE}.outstanding_balance + CASE WHEN {CUBE}.is_applicant THEN {CUBE}.requested_amount ELSE 0 END'
    type: number
    description: Outstanding balances at this member, plus the requested amount if it is the applicant.
  measures:
  - name: group_exposure
    type: number
    sql: SUM({exposure})
    description: Requested amount plus outstanding balances across the group.
  - name: group_size
    type: number
    sql: COUNT({member_business_id})
