# GENERATED by `brightwater semantic build` from brightwater.ossie.yaml. Do not edit;
# change the Ossie model and rebuild.
cubes:
- name: related_facility
  description: One row per application per facility at the applicant or at any business in which an owner of the
    applicant holds a stake. owner_stake_pct is the largest such stake (100 for the applicant's own facilities).
  sql: SELECT a.application_id, a.submitted_on, f.facility_id, f.business_id, r.owner_stake_pct, (SELECT min(p.due_date)
    FROM credit.payment p WHERE p.facility_id = f.facility_id AND p.due_date <= a.submitted_on AND (p.paid_date
    IS NULL OR p.paid_date > a.submitted_on)) AS oldest_unpaid_due FROM credit.application a CROSS JOIN LATERAL
    ( SELECT a.business_id, 100::numeric UNION ALL SELECT o2.business_id, max(o2.pct) FROM registry.ownership o1
    JOIN registry.ownership o2 ON o2.person_id = o1.person_id AND o2.business_id <> a.business_id WHERE o1.business_id
    = a.business_id GROUP BY o2.business_id ) AS r (business_id, owner_stake_pct) JOIN credit.facility f ON f.business_id
    = r.business_id
  joins:
  - name: application
    relationship: many_to_one
    sql: '{CUBE}.application_id = {application}.application_id'
  dimensions:
  - name: application_id
    sql: '{CUBE}.application_id'
    type: string
    primary_key: true
    public: true
  - name: facility_id
    sql: '{CUBE}.facility_id'
    type: string
    primary_key: true
    public: true
  - name: business_id
    sql: '{CUBE}.business_id'
    type: string
  - name: owner_stake_pct
    sql: '{CUBE}.owner_stake_pct'
    type: number
  - name: days_past_due
    sql: COALESCE({CUBE}.submitted_on - {CUBE}.oldest_unpaid_due, 0)
    type: number
    description: Days from the oldest payment still unpaid on the application date; 0 if none.
  measures:
  - name: max_days_past_due
    type: number
    sql: MAX({days_past_due})
